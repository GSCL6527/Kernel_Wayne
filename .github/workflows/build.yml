name: Kernel Build

on:
  push:
    branches: [ tulip-p-oss ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.device }} (${{ matrix.defconfig }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - defconfig: wayne-perf
            device: wayne
    defaults:
      run:
        shell: bash
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: gscl6527
      KBUILD_BUILD_HOST: github-actions
      DEFCONFIG: ${{ matrix.defconfig }}
      CCACHE_DIR: /root/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio curl \
            device-tree-compiler file flex git lib32z1 lib32stdc++6 libc6-i386 \
            libelf-dev libncurses5 libssl-dev python2 rsync unzip xz-utils zip
          # AOSP gcc-4.9 driver is a python2 wrapper expecting /usr/bin/python
          ln -sf /usr/bin/python2 /usr/bin/python
          python --version

      - name: Fetch AOSP GCC 4.9 aarch64 toolchain
        run: |
          set -euo pipefail
          TC_DIR=/tmp/toolchain
          rm -rf "$TC_DIR"

          URLS=(
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
            "https://github.com/AOSPA/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
          )
          ok=0
          for url in "${URLS[@]}"; do
            echo "--> trying $url"
            if git clone --depth 1 "$url" "$TC_DIR" 2>&1 | tail -3; then
              if [ -d "$TC_DIR/bin" ]; then ok=1; break; fi
            fi
            rm -rf "$TC_DIR"
          done
          if [ "$ok" != "1" ]; then echo "::error::could not fetch any aarch64 toolchain"; exit 1; fi

          echo "--- toolchain bin ---"
          ls -la "$TC_DIR/bin" | head -15
          echo "--- file type ---"
          file "$TC_DIR/bin/aarch64-linux-android-gcc" || true
          "$TC_DIR/bin/aarch64-linux-android-gcc" --version | head -1

          echo "CROSS_COMPILE=$TC_DIR/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ matrix.defconfig }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.defconfig }}-

      - name: Compile kernel (${{ matrix.defconfig }}_defconfig)
        run: |
          set -euo pipefail
          export PATH="${CROSS_COMPILE%/*}:$PATH"
          mkdir -p out

          echo "::group::defconfig"
          make -s O=out ARCH=arm64 "${DEFCONFIG}_defconfig"
          echo "::endgroup::"
          test -f out/.config

          echo "::group::make Image.gz-dtb"
          make O=out ARCH=arm64 -j"$(nproc)" \
               CC="ccache ${CROSS_COMPILE}gcc" \
               Image.gz-dtb 2>&1 | tee build.log
          echo "::endgroup::"

          ls -lh out/arch/arm64/boot/

      - name: Package artifacts
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz-dtb "dist/Image.gz-dtb"
          cp out/.config "dist/config-${DEFCONFIG}"
          cp build.log dist/ 2>/dev/null || true
          {
            echo "### ${{ matrix.device }} / ${DEFCONFIG}"
            echo ""
            echo "| file | size |"
            echo "| --- | --- |"
            ls -lh dist | awk 'NR>1 {print "| " $9 " | " $5 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Wayne-${{ matrix.device }}-${{ github.run_number }}
          path: |
            dist/*
            build.log
          if-no-files-found: warn
          retention-days: 90
